[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "graphkv"
version = "0.1.0"
description = "Graph-guided low-bit KV cache compression for transformer inference."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "heterodoxin" }
]
keywords = ["kv-cache", "quantization", "transformers", "vllm", "llama.cpp", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1",
]

[project.optional-dependencies]
transformers = ["transformers>=4.44"]
dev = ["pytest>=8", "transformers>=4.44"]

[project.urls]
Homepage = "https://github.com/heterodoxin/graphkv"
Issues = "https://github.com/heterodoxin/graphkv/issues"

[project.scripts]
graphkv-benchmark = "graphkv.benchmark:main"
graphkv-recipes = "graphkv.integrations:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
